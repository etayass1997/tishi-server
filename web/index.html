<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>תישי</title>
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תישי">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>תישי</h1>
    <button id="settings-btn" aria-label="הגדרות" title="הגדרות">⚙</button>
  </header>

  <main id="messages"></main>
  <div id="typing" class="hidden">תישי כותב...</div>

  <form id="composer">
    <textarea id="input" placeholder="כתוב הודעה לתישי..." rows="1"></textarea>
    <button type="submit" id="send-btn" aria-label="שלח">➤</button>
  </form>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-content">
    <h2>הגדרות</h2>

    <label for="username-input">השם שלך</label>
    <input id="username-input" type="text">

    <label>דברים שתישי זוכר עליך</label>
    <div id="facts-list"></div>
    <div class="fact-add">
      <input id="fact-input" type="text" placeholder="עובדה חדשה...">
      <button id="fact-add-btn">הוסף</button>
    </div>

    <div class="modal-actions">
      <button id="clear-chat-btn" class="danger">נקה שיחה</button>
      <button id="close-settings-btn">סגור</button>
    </div>
  </div>
</div>

<script>window.TISHI_API_KEY = "__API_KEY__";</script>
<script src="/app.js"></script>
</body>
</html>
